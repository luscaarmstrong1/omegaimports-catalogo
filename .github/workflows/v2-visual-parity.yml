name: V2 visual parity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: Audit frozen checksums
        run: pnpm run audit:v2-checksums

      - name: Audit frozen DOM
        run: pnpm run audit:v2-dom

      - name: Audit visual parity
        run: pnpm run audit:v2-visual

      - name: Upload visual parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-parity-${{ github.run_id }}
          path: reports/v2-parity/
          if-no-files-found: warn
          retention-days: 14
